name: Release

# Builds the Windows installer, signs it for the updater, and attaches it with latest.json
# to a draft GitHub release. Publishing the draft makes it the version installed copies find.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater key (see README, "Build the installer")
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password, or empty when it has none
#   NOVABOX_GOOGLE_CLIENT_ID            the Google OAuth client, as in .env
#   NOVABOX_GOOGLE_CLIENT_SECRET

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The release is named after the version in tauri.conf.json. If that lags behind the
      # tag, the build is uploaded over the older release instead of making a new one.
      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($conf -ne $package -or $conf -ne $cargo) {
            throw "Versions differ: tauri.conf.json $conf, package.json $package, Cargo.toml $cargo."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$conf") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $conf."
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOVABOX_GOOGLE_CLIENT_ID: ${{ secrets.NOVABOX_GOOGLE_CLIENT_ID }}
          NOVABOX_GOOGLE_CLIENT_SECRET: ${{ secrets.NOVABOX_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: "Novabox v__VERSION__"
          releaseBody: "Download the installer below. Installed copies update themselves from Settings > About."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
