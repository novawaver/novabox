[package]
name = "novabox"
version = "0.1.0"
description = "Novabox, a local-only multi-account Gmail client"
authors = ["Novawave"]
edition = "2021"

[lib]
name = "novabox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Without a native backend feature keyring silently falls back to an in-memory mock store,
# which loses every sign-in when the app quits.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
url = "2"
chrono = { version = "0.4", features = ["clock"] }
encoding_rs = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
open = "5"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
